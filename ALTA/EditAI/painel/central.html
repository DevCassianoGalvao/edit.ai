<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="/app/manifest.json">
<link rel="icon" href="/app/editai512.png">
<link rel="apple-touch-icon" href="/app/editai512.png">
<title>Edit.AI by Galvão</title>
<style>
:root{--bg:#0f1115;--card:#171a21;--card2:#1e222b;--linha:#2a2f3a;--txt:#e8eaef;--sub:#9aa3b2;--ok:#3ecf8e;--aviso:#f5b83d;--erro:#ff5d5d;--azul:#5aa9ff;--r:14px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif;padding:0 0 60px}
header{position:sticky;top:0;z-index:5;background:rgba(15,17,21,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--linha);padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.2px}
header .sub{color:var(--sub);font-size:13px}
header nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
header nav a{color:var(--sub);text-decoration:none;font-size:13px;padding:6px 10px;border:1px solid var(--linha);border-radius:999px}
header nav a:hover{color:var(--txt)}
main{max-width:1180px;margin:0 auto;padding:16px;display:grid;gap:16px}
h2{font-size:14px;text-transform:uppercase;letter-spacing:1px;color:var(--sub);margin:4px 0 8px;font-weight:600}
.card{background:var(--card);border:1px solid var(--linha);border-radius:var(--r);padding:14px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.chip{background:var(--card2);border:1px solid var(--linha);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-height:74px}
.chip .t{font-size:12px;color:var(--sub)}
.chip .v{font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px}
.bola{width:10px;height:10px;border-radius:50%;flex:none;background:var(--sub)}
.ok .bola{background:var(--ok);box-shadow:0 0 8px var(--ok)}.aviso .bola{background:var(--aviso)}.erro .bola{background:var(--erro);box-shadow:0 0 8px var(--erro)}
.barra{height:6px;background:var(--linha);border-radius:4px;overflow:hidden}.barra i{display:block;height:100%;background:var(--azul)}
.alerta{border-radius:var(--r);padding:14px;border:1px solid;display:grid;gap:8px}
.alerta.alto{background:#2a1517;border-color:#5c2228}.alerta.medio{background:#2a2213;border-color:#5a4719}
.alerta.info{background:#211b31;border-color:#55427b}
.alerta b{font-size:15px}.alerta p{margin:0;color:#d9dce3}
.vazio{color:var(--ok);display:flex;gap:8px;align-items:center}
button,.btn{font:inherit;font-size:14px;border:1px solid var(--linha);background:var(--card2);color:var(--txt);padding:9px 13px;border-radius:10px;cursor:pointer;min-height:40px}
button:hover{border-color:#47506a}button.pri{background:#1d4ed8;border-color:#2b5ff0}button.peri{background:#3a1d20;border-color:#6b2b31}
button:disabled{opacity:.45;cursor:default}
.acoes{display:flex;flex-wrap:wrap;gap:8px}
.baia{display:grid;gap:8px}.baia .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--card2);border:1px solid var(--linha);color:var(--sub)}
.tag.ok{color:var(--ok)}.tag.aviso{color:var(--aviso)}.tag.erro{color:var(--erro)}
.lista{display:grid;gap:8px}.item{background:var(--card2);border:1px solid var(--linha);border-radius:12px;padding:10px 12px;display:grid;gap:6px}
.item .lin{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.pequeno{font-size:12.5px;color:var(--sub)}
.entregas{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.ent .btn.folder{background:rgba(155,116,255,.16);color:#d6c7ff;border-color:rgba(155,116,255,.32);font-weight:650}
.ent .btn.folder:hover{background:rgba(155,116,255,.26);border-color:#9b74ff}
.ent img.capa{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;background:#000;display:block}
.minis{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}.minis img{height:56px;aspect-ratio:16/9;object-fit:cover;border-radius:6px;cursor:pointer;border:2px solid transparent}
.minis img.sel{border-color:var(--ok)}
.duas{display:grid;gap:16px;grid-template-columns:1fr 1fr}
@media(max-width:820px){.duas{grid-template-columns:1fr}header nav{margin-left:0}}
dialog{background:var(--card);color:var(--txt);border:1px solid var(--linha);border-radius:var(--r);max-width:min(680px,94vw);width:100%;padding:16px}
dialog::backdrop{background:rgba(0,0,0,.6)}
pre{white-space:pre-wrap;word-break:break-word;background:#0b0d11;border-radius:10px;padding:10px;max-height:55vh;overflow:auto;font-size:12px}
label.op{display:flex;gap:10px;align-items:flex-start;padding:8px;border-radius:8px;background:var(--card2);border:1px solid var(--linha)}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#222838;border:1px solid var(--linha);padding:10px 16px;border-radius:12px;z-index:20;max-width:92vw;display:none}
input[type=text]{font:inherit;background:var(--card2);color:var(--txt);border:1px solid var(--linha);border-radius:10px;padding:9px 11px;width:100%}
.feed{max-height:260px;overflow:auto;display:grid;gap:4px}
.feed div{font-size:13px;color:#cfd3dc}.feed span{color:var(--sub);font-size:12px;margin-right:6px}
</style>
<link rel="icon" type="image/svg+xml" href="/app/editai.svg"><link rel="stylesheet" href="/app/space-grotesk.css"><link rel="stylesheet" href="/app/editai.css?v=7">
</head>
<body class="page-central">
<header>
  <div class="central-brand"><span class="editai-mark" aria-hidden="true">AI</span><div><h1>Edit.AI <small>by Galvão</small></h1><div class="sub" id="atual">conectando…</div></div></div>
  <nav><a href="/">Painel</a><a href="/estudio#config">Configurações</a><a href="#pautas">Pautas</a><a href="#entregas">Entregas</a><a href="#config">Ajustes</a></nav>
</header>
<main>
  <section><h2>Avisos</h2><div id="alertas" class="lista"></div></section>
  <section><h2>Saúde do sistema</h2><div class="grid" id="saude"></div></section>
  <section><h2>Baias</h2><div class="duas" id="baias"></div></section>
  <section class="duas">
    <div><h2>Filmes na fila e em produção</h2><div class="card lista" id="fila"></div></div>
    <div><h2>O que os funcionários fizeram</h2><div class="card feed" id="feed"></div></div>
  </section>
  <section id="pautas"><h2>Pautas para aprovar</h2><div class="card" id="pautasbox"></div></section>
  <section id="entregas"><h2>Entregas recentes</h2><div class="entregas" id="ents"></div></section>
  <section><h2>Ações da Central</h2><div class="card lista" id="acoes"></div></section>
  <section id="config"><h2>Ajustes</h2><div class="card lista" id="cfg"></div></section>
</main>
<dialog id="dlg"><div id="dlgc"></div><div class="acoes" style="margin-top:12px;justify-content:flex-end"><button onclick="dlg.close()">Fechar</button></div></dialog>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S=null, pautaSel=new Set();
const ROT={retomar_render:'Retomar render',retomar_diretor:'Diretor continua',devolver_fila:'Recomeçar do zero',refazer_clipes:'Refazer clipes ruins',
  esvaziar_apagar:'Esvaziar pastas APAGAR',ligar_servicos:'Ligar gerente'};
const EXPLICA={
  retomar_render:'Roda de novo o render + entrega deste filme com o mesmo comando de antes. A entrega sai sozinha no fim.',
  retomar_diretor:'Reabre o Diretor (Claude) deste filme na mesma conversa, com a ordem de descobrir onde parou e continuar.',
  devolver_fila:'Devolve o pedido para a fila: ele começa de novo do zero quando houver baia livre. Use só se o resto não funcionar.',
  refazer_clipes:'Confere todos os clipes de vídeo da baia, separa os corrompidos numa pasta APAGAR e corta de novo na CPU.',
  esvaziar_apagar:'Manda as pastas APAGAR_* (material de filmes já entregues) para a Lixeira do Windows. Depois é só esvaziar a Lixeira.',
  ligar_servicos:'Liga o gerente dos funcionários de novo.'};
function toast(t,ms=4200){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',ms)}
function tempo(s){if(s==null)return '—';s=Math.max(0,Math.round(s));if(s<90)return s+' s';if(s<5400)return Math.round(s/60)+' min';return (s/3600).toFixed(1).replace('.',',')+' h'}
async function api(u,o){const r=await fetch(u,o);if(!r.ok)throw new Error(r.status);return r.json()}
async function acao(nome,args={},confirma=true){
  if(confirma&&EXPLICA[nome]&&!confirm((ROT[nome]||nome)+'\n\n'+EXPLICA[nome]+'\n\nContinuar?'))return;
  try{const r=await api('/api/central/acao',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({acao:nome,...args})});
    if(!r.ok){toast('Não deu: '+(r.erro||'erro'));return}
    toast(r.resumo||'Começou — acompanhe em "Ações da Central"');setTimeout(carrega,1200)}catch(e){toast('Sem resposta do painel ('+e.message+')')}
}
function botoes(lista,ctx){return (lista||[]).map(b=>`<button class="${b==='devolver_fila'?'peri':'pri'}" onclick='acao("${b}",${JSON.stringify(ctx||{})})'>${esc(ROT[b]||b)}</button>`).join('')}
function rAlertas(){
  const a=S.alertas||[];
  $('#alertas').innerHTML=a.length?a.map(x=>`<div class="alerta ${x.nivel}"><b>${x.nivel==='alto'?'⛔':x.nivel==='info'?'ⓘ':'⚠️'} ${esc(x.titulo)}</b><p>${esc(x.texto)}</p>
    ${x.botoes&&x.botoes.length?`<div class="acoes">${botoes(x.botoes,{pedido:x.pedido,baia:x.baia})}</div>`:''}</div>`).join('')
    :`<div class="card vazio"><span class="bola" style="background:var(--ok)"></span> Tudo andando — nenhum aviso.</div>`;
}
function chip(t,v,cls,extra=''){return `<div class="chip ${cls}"><div class="t">${t}</div><div class="v"><span class="bola"></span>${v}</div>${extra}</div>`}
function rSaude(){
  const g=S.gerente,d=S.disco,ap=S.apagar||{},tf=S.tarefas||{};
  const tok=Object.values(tf).length&&Object.values(tf).every(Boolean);
  $('#saude').innerHTML=[
    chip('Painel','no ar','ok'),
    chip('Gerente',g.vivo?'trabalhando':'parado',g.vivo?'ok':(g.ligado?'erro':'aviso'),`<div class="pequeno">${g.vivo?'visto há '+tempo(g.visto_s):''}</div>`),
    chip('Funcionários',g.ligado?'ligados':'desligados',g.ligado?'ok':'aviso',`<div><button style="min-height:30px;padding:4px 10px" onclick='acao("funcionarios",{ligado:${!g.ligado}},false)'>${g.ligado?'Desligar':'Ligar'}</button></div>`),
    chip('Retomada após reinício',tok?'configurada':'manual',tok?'ok':'aviso'),
    chip('Disco C:',d.livre_gb+' GB livres',d.livre_gb<8?'erro':d.livre_gb<15?'aviso':'ok',`<div class="barra"><i style="width:${d.usado_pct}%"></i></div>`),
    chip('Pastas APAGAR',(ap.gb??'?')+' GB · '+(ap.n??'?'),ap.gb>20?'aviso':'ok',ap.n?`<div><button style="min-height:30px;padding:4px 10px" onclick='acao("esvaziar_apagar")'>Mandar p/ Lixeira</button></div>`:''),
    chip('Último erro de IA',S.claude_limite?'registrado':'nenhum recente',S.claude_limite?'erro':'ok'),
    chip('Render',S.render?'renderizando':'livre',S.render?'ok':'')
  ].join('');
}
function etapaTag(p){const c=p.problema?'erro':p.status==='esperando_voce'?'aviso':p.status==='produzindo'?'ok':'';return `<span class="tag ${c}">${esc(p.status)}${p.etapa?' · '+esc(p.etapa):''}</span>`}
function rBaias(){
  $('#baias').innerHTML=(S.baias||[]).map(b=>{
    const p=(S.pedidos||[]).find(x=>x.id===b.pedido);
    const prob=p&&p.problema;
    return `<div class="card baia"><div class="top"><b>${b.baia.toUpperCase()}</b>${p?etapaTag(p):'<span class="tag">livre</span>'}</div>
      ${p?`<div><b>${esc(p.titulo||p.id)}</b></div><div class="barra"><i style="width:${p.pct||0}%"></i></div>
        <div class="pequeno">${esc(p.msg||'')}</div>
        <div class="pequeno">${p.ativa?'👷 '+esc(p.ativa.papel||'diretor')+' trabalhando agora':'ninguém com sessão aberta'} · último arquivo novo há ${tempo(b.atividade_s)}</div>
        ${prob?`<div class="alerta alto"><p>${esc(prob.texto)}</p><div class="acoes">${botoes(prob.botoes,{pedido:p.id,baia:b.baia})}</div></div>`:''}`
      :`<div class="pequeno">último filme: ${esc(b.ultimo_slug||'—')}</div>`}
      <div class="acoes"><button onclick='acao("refazer_clipes",{baia:"${b.baia}"})' ${b.livre?'':'title="melhor com a baia parada"'}>Refazer clipes ruins</button>
      <button onclick='abreTrilha("${b.baia}")'>Trocar trilha</button></div></div>`}).join('');
}
function rFila(){
  const ps=(S.pedidos||[]).filter(p=>!['entregue','cancelado'].includes(p.status)||p.parado_ha_s<3600);
  $('#fila').innerHTML=ps.length?ps.map(p=>`<div class="item"><div class="lin"><b>${esc(p.titulo||p.id)}</b>${etapaTag(p)}</div>
    <div class="pequeno">${p.baia?p.baia.toUpperCase()+' · ':''}${esc(p.msg||'')} · atualizado há ${tempo(p.parado_ha_s)}</div></div>`).join(''):'<div class="pequeno">Fila vazia.</div>';
  $('#feed').innerHTML=(S.feed||[]).slice().reverse().map(f=>`<div><span>${new Date(f.t*1000).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</span><b>${esc(f.quem)}</b> ${esc(f.txt)}</div>`).join('');
}
function rPautas(){
  const pa=S.pautas||{},pr=pa.propostas||[];
  const cont=Object.entries(pa.contagem||{}).map(([k,v])=>`${k}: ${v}`).join(' · ');
  $('#pautasbox').innerHTML=`<div class="pequeno" style="margin-bottom:8px">${esc(cont)}</div>`+(pr.length?`<div class="lista">${pr.map(p=>`<label class="op"><input type="checkbox" ${pautaSel.has(p.id)?'checked':''} onchange="this.checked?pautaSel.add('${p.id}'):pautaSel.delete('${p.id}')">
      <div><b>${esc(p.titulo)}</b><div class="pequeno">${esc(p.canal||'')}${p.titulo_pt&&p.titulo_pt!==p.titulo?' · '+esc(p.titulo_pt):''}${p.status==='erro'?' · ERRO: '+esc(p.msg||''):''}</div></div></label>`).join('')}</div>
    <div class="acoes" style="margin-top:10px"><button class="pri" onclick="pauta('aprovar')">Aprovar marcadas</button><button class="peri" onclick="pauta('descartar')">Descartar marcadas</button></div>`
    :'<div class="pequeno">Nenhuma pauta esperando aprovação.</div>');
}
async function pauta(a){
  if(!pautaSel.size){toast('Marque pelo menos uma pauta');return}
  const r=await api('/api/pautas',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({acao:a,ids:[...pautaSel]})});
  toast(r.ok?`${r.n} pauta(s) ${a==='aprovar'?'aprovada(s) — o roteirista pega na ordem':'descartada(s)'}`:'Não deu: '+(r.erro||''));pautaSel.clear();carrega(true)
}
function img(slug,f){return `/central/arquivo?slug=${encodeURIComponent(slug)}&f=${encodeURIComponent('miniaturas/'+f)}`}
function rEntregas(){
  $('#ents').innerHTML=(S.entregas||[]).map(e=>{const capa=e.principal||e.miniaturas.find(m=>m.startsWith('flow_'))||e.miniaturas[0], pronto=e.pronto===true||Number(e.mb)>0;
    return `<div class="card ent lista">${capa?`<img class="capa" loading="lazy" src="${img(e.slug,capa)}">`:''}
    <div><b>${esc(e.nome)}</b><div class="pequeno">${esc(e.quando)} · ${pronto?'Render concluído · entregas/'+esc(e.slug):'Render ainda não concluído'} · ${e.mb} MB${e.material?' · material no APAGAR':''}</div></div>
    <div class="minis">${e.miniaturas.map(m=>`<img loading="lazy" title="${esc(m)} — toque para marcar como principal" class="${e.principal&&m==='_PRINCIPAL.jpg'?'sel':''}" src="${img(e.slug,m)}" onclick='principal("${e.slug}","${m}")'>`).join('')}</div>
    <div class="acoes">${pronto?`<button class="btn folder" data-pasta-render="${esc(e.slug)}">📁 Abrir pasta do render</button>`:`<span class="pequeno">Render ainda não concluído</span>`}<label class="btn">Enviar miniatura<input type="file" accept="image/*" hidden onchange='enviaThumb("${e.slug}",this)'></label>
    <button onclick='rerender("${e.slug}")'>Re-renderizar</button><button onclick='acao("devolver_material",{slug:"${e.slug}"},false)'>Devolver material</button></div></div>`}).join('');
  $('#ents').querySelectorAll('[data-pasta-render]').forEach(b=>b.onclick=()=>acao('abrir_pasta_entrega',{slug:b.dataset.pastaRender},false));
}
function principal(slug,m){if(confirm('Marcar '+m+' como miniatura principal deste filme?'))acao('thumb_principal',{slug,arquivo:m},false)}
async function enviaThumb(slug,inp){const f=inp.files[0];if(!f)return;toast('Enviando…');
  const r=await fetch(`/api/central/thumb?slug=${encodeURIComponent(slug)}&nome=${encodeURIComponent(f.name)}`,{method:'PUT',body:f}).then(r=>r.json());
  toast(r.ok?'Miniatura salva: '+r.arquivo:'Não deu: '+(r.erro||''));carrega(true)}
function rerender(slug){
  $('#dlgc').innerHTML=`<h3 style="margin-top:0">Re-renderizar ${esc(slug)}</h3><p class="pequeno">Devolve o material do APAGAR para a baia, refaz os trechos e entrega de novo sozinho. Só funciona se a baia ainda tiver os dados deste filme (não começou outro).</p>
   <div class="lista"><button class="pri" onclick='dlg.close();acao("rerenderizar",{slug:"${slug}",modo:"ffmpeg"},false)'>Refazer fotos e vídeos (mais rápido)</button>
   <button onclick='dlg.close();acao("rerenderizar",{slug:"${slug}",modo:"tudo"},false)'>Refazer o filme inteiro (inclui animações)</button></div>`;dlg.showModal()}
async function abreTrilha(b){
  const r=await api('/api/central/faixas?b='+b);
  $('#dlgc').innerHTML=`<h3 style="margin-top:0">Trilha da ${b.toUpperCase()}</h3><p class="pequeno">Marque as faixas (a 1ª vira a da abertura, as outras giram nos capítulos). Baixe as músicas na Biblioteca de Áudio do YouTube Studio — elas aparecem aqui pela pasta Downloads.</p>
   <div class="lista" style="max-height:46vh;overflow:auto">${r.faixas.map((f,i)=>`<label class="op"><input type="checkbox" value="${esc(f.arquivo)}" ${f.no_filme?'checked':''}><div><b>${esc(f.nome)}</b><div class="pequeno">${f.origem}${f.no_filme?' · no filme agora':''}</div></div></label>`).join('')||'<div class="pequeno">Nenhum .mp3 encontrado.</div>'}</div>
   <label class="op" style="margin-top:8px"><input type="checkbox" id="remux" checked><div>Trocar também o áudio do filme já entregue desta baia</div></label>
   <div class="acoes" style="margin-top:10px"><button class="pri" onclick="trilha('${b}')">Mixar trilha nova</button></div>`;dlg.showModal()}
function trilha(b){const fx=[...document.querySelectorAll('#dlgc input[type=checkbox][value]:checked')].map(i=>i.value);
  if(!fx.length){toast('Marque pelo menos 1 faixa');return}dlg.close();acao('trocar_trilha',{baia:b,faixas:fx,remux:$('#remux')?.checked},false)}
function rAcoes(){
  const a=S.acoes||[];
  $('#acoes').innerHTML=a.length?a.map(x=>`<div class="item"><div class="lin"><b>${esc(x.rotulo)}</b><span class="tag ${x.fim?(x.ok?'ok':'erro'):'aviso'}">${x.fim?(x.ok?'feito':'falhou'):'rodando…'}</span></div>
    <div class="pequeno">${esc(x.resumo||'')}</div><div><button style="min-height:30px;padding:4px 10px" onclick='verLog("${x.id}")'>Ver detalhes</button></div></div>`).join(''):'<div class="pequeno">Nenhuma ação desde que o painel abriu.</div>';
}
async function verLog(id){const r=await api('/api/central/log?id='+encodeURIComponent(id));$('#dlgc').innerHTML=`<h3 style="margin-top:0">${esc(r.acao||'')}</h3><pre>${esc(r.log||'')}</pre>`;dlg.showModal()}
function rCfg(){
  const c=S.conf||{};
  $('#cfg').innerHTML=`
   <div class="item"><div class="lin"><b>Avisos no celular (ntfy)</b><span class="tag ${c.ntfy?'ok':''}">${c.ntfy?'ligado':'desligado'}</span></div>
     <div class="pequeno">Instale o app grátis <b>ntfy</b> (Android/iPhone), toque em + e assine o tópico <b>${esc(c.topico)}</b>. Quando um filme travar, o disco encher ou o gerente cair, chega notificação. O aviso vai pelo servidor público ntfy.sh — só o texto do aviso, nada de vídeo ou senha.</div>
     <div class="acoes"><button class="pri" onclick='acao("notificar",{ligado:${!c.ntfy}},false)'>${c.ntfy?'Desligar':'Ligar'} avisos no celular</button><button onclick='acao("testar_aviso",{},false)'>Mandar aviso de teste</button></div></div>
   <div class="item"><div class="lin"><b>Usar pelo celular</b><span class="tag ${c.remoto?'ok':''}">${c.remoto?'ligado':'desligado'}</span></div>
     <div class="pequeno">Ligado, o painel aceita o celular — só com a chave secreta do link abaixo. No Wi-Fi de casa funciona direto; de qualquer lugar, instale o <b>Tailscale</b> no PC e no celular (grátis, mesma conta) e o link passa a usar o endereço dele. Na 1ª vez o Windows pergunta se libera o Python no Firewall: aceite em "Redes privadas".</div>
     ${c.link_celular?`<input type="text" readonly value="${esc(c.link_celular.url)}" onclick="this.select()"><div class="pequeno">rede: ${esc(c.link_celular.tipo)} — abra este link no celular e use "Adicionar à tela inicial" para virar app.</div>`:''}
     <div class="acoes"><button class="pri" onclick='if(confirm("O painel vai reiniciar (fica fora uns 5 s). Continuar?"))acao("remoto",{ligado:${!c.remoto}},false)'>${c.remoto?'Desligar':'Ligar'} acesso pelo celular</button></div></div>
   <div class="item"><div class="lin"><b>Abrir o app com o Windows</b><span class="tag ${c.autostart?'ok':''}">${c.autostart?'ligado':'desligado'}</span></div>
     <div class="pequeno">Painel e gerente já voltam sozinhos pela tarefa do Agendador; isto abre também a janela da Central quando você entra no Windows.</div>
     <div class="acoes"><button onclick='acao("autostart",{ligado:${!c.autostart}},false)'>${c.autostart?'Não abrir':'Abrir'} com o Windows</button></div></div>
   <div class="item"><div class="lin"><b>Gerente</b></div><div class="acoes"><button onclick='if(confirm("Reiniciar o gerente? Os diretores abertos continuam."))acao("reiniciar_gerente",{},false)'>Reiniciar gerente</button></div></div>`;
}
async function carrega(forcar){
  try{S=await api('/api/central'+(forcar?'?forcar=1':''));
    $('#atual').textContent='atualizado '+new Date().toLocaleTimeString('pt-BR')+(S.alertas.length?` · ${S.alertas.length} aviso(s)`:' · tudo ok');
    document.title=(S.alertas.length?`(${S.alertas.length}) `:'')+'Edit.AI by Galvão';
    rAlertas();rSaude();rBaias();rFila();rAcoes();
    if(!document.activeElement||!document.activeElement.closest('#pautasbox'))rPautas();
    if(!carrega._e||forcar){rEntregas();carrega._e=1}
    if(!document.activeElement||!document.activeElement.closest('#cfg'))rCfg();
  }catch(e){$('#atual').textContent='sem conexão com o painel — tentando de novo…'}
}
carrega(true);setInterval(()=>carrega(),5000);setInterval(()=>{carrega._e=0},60000);
if('serviceWorker' in navigator){}
</script>
